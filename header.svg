<svg width="900" height="172" viewBox="0 0 900 172" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg        { fill: #0d1117; }
      .scan      { fill: none; stroke: #161b22; stroke-width: 1; }
      .name      {
                   font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
                   font-size: 52px; font-weight: 700;
                   fill: #e6edf3; letter-spacing: -0.5px;
                   clip-path: inset(0 100% 0 0);
                   animation: revealName 1.4s steps(6, end) 0.4s forwards;
                 }
      .cursor-a  {
                   font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
                   font-size: 52px; font-weight: 400; fill: #e6edf3;
                   animation: blinkA 0.7s step-end 1.8s 4, none 0s 4.6s forwards;
                   opacity: 0;
                 }
      .tagline   {
                   font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
                   font-size: 13px; font-weight: 400;
                   fill: #848d97; letter-spacing: 0.3px;
                   clip-path: inset(0 100% 0 0);
                   animation: revealTag 2.2s steps(46, end) 2.2s forwards;
                 }
      .cursor-b  {
                   font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
                   font-size: 13px; fill: #848d97;
                   animation: blinkB 0.7s step-end 4.4s infinite;
                   opacity: 0;
                 }
      .divider   {
                   stroke: #21262d; stroke-width: 1;
                   stroke-dasharray: 820; stroke-dashoffset: 820;
                   animation: drawLine 0.9s cubic-bezier(0.4, 0, 0.2, 1) 2.0s forwards;
                 }
      .meta      {
                   font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
                   font-size: 10px; fill: #3d444d; letter-spacing: 0.8px;
                   animation: fadeIn 0.6s ease 4.2s both;
                 }
      .dot       { animation: fadeIn 0.6s ease 4.2s both; }

      @keyframes revealName {
        from { clip-path: inset(0 100% 0 0); }
        to   { clip-path: inset(0 0% 0 0);   }
      }
      @keyframes revealTag {
        from { clip-path: inset(0 100% 0 0); }
        to   { clip-path: inset(0 0% 0 0);   }
      }
      @keyframes blinkA {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0; }
      }
      @keyframes blinkB {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0; }
      }
      @keyframes drawLine {
        to { stroke-dashoffset: 0; }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
    </style>

    <!-- subtle scanline pattern -->
    <pattern id="scan" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="900" height="1" fill="#ffffff" opacity="0.012"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="900" height="172" class="bg"/>
  <!-- Scanline overlay -->
  <rect width="900" height="172" fill="url(#scan)"/>

  <!-- Left edge accent -->
  <rect x="0" y="32" width="3" height="108" fill="#e6edf3" opacity="0.85"/>

  <!-- Name -->
  <text class="name" x="28" y="84">wydvoy</text>
  <!-- Blinking cursor after name -->
  <text class="cursor-a" x="212" y="84">|</text>

  <!-- Divider line -->
  <line x1="28" y1="100" x2="872" y2="100" class="divider"/>

  <!-- Tagline -->
  <text class="tagline" x="28" y="124">building tools that think, track, and automate</text>
  <!-- Blinking underscore cursor -->
  <text class="cursor-b" x="401" y="124">_</text>

  <!-- Bottom-right meta labels -->
  <circle cx="748" cy="150" r="3" fill="#3d444d" class="dot"/>
  <text class="meta" x="758" y="154">TS</text>
  <circle cx="783" cy="150" r="3" fill="#3d444d" class="dot"/>
  <text class="meta" x="793" y="154">PY</text>
  <circle cx="820" cy="150" r="3" fill="#3d444d" class="dot"/>
  <text class="meta" x="830" y="154">RN</text>

  <!-- Prompt symbol bottom-left -->
  <text class="meta" x="28" y="154" fill="#3d444d" style="opacity:1; animation: fadeIn 0.6s ease 4.2s both;">~/wydvoy $</text>
</svg>
